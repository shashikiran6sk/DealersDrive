# ---------------------------------------------------------------------------
# CI — every pull request, and every push to main.
#
# This workflow proves a commit is correct. It builds no image, pushes nothing
# and touches no environment: a pull request from a fork must be able to run it
# in full without holding a single credential.
#
# The same four commands the working agreements name (`lint`, `typecheck`,
# `test`, `build`) run here, in one job, against one Postgres service — the
# integration suite is not a mock, it asserts invariants that only exist in the
# database, so CI runs a real one.
#
# It does NOT build a container image. It used to — a `docker` job proved both
# images still built from a clean context — but the web image no longer exists
# (D7 put the front end on Vercel) and release.yml builds the API image on
# every merge anyway. Two jobs building the same bytes at the same moment is
# twenty-five minutes bought twice, so the check now lives in one place: on
# main, where the image is actually produced.
#
# It also no longer typechecks the sandbox. That gate is gone at the author's
# request; `pnpm build` does not cover `apps/sandbox`, so a prop rename that
# breaks a story is now found by running `pnpm sandbox`, not by CI.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch. A force-push mid-review should not leave two suites
# racing, and the newer commit is the only one anybody cares about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Turbo prints one line per task instead of an animated frame buffer.
  TURBO_UI: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # These credentials are not a placeholder — `apps/api/tests/global-setup.ts`
      # connects to `dealersdrive:dealersdrive@localhost:5432/dealersdrive` and
      # creates `dealersdrive_test` from it. Change them here and the
      # integration suite cannot find a database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealersdrive
          POSTGRES_PASSWORD: dealersdrive
          POSTGRES_DB: dealersdrive
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dealersdrive -d dealersdrive"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated, not committed. Nothing that imports
      # `@prisma/client` type-checks until it exists, so this runs before the
      # checks rather than as part of one of them.
      - name: Generate Prisma client
        run: pnpm --filter @dealers-drive/api db:generate

      # Formatting is a gate now. It was deliberately left out while ~120 files
      # were unformatted — a check that is always red is a check nobody reads —
      # and the fix was to run `pnpm format` once across the repository rather
      # than to keep excusing the gap. The two long-form design documents are in
      # .prettierignore, because reflowing their tables makes a diff unreadable
      # and breaks the section numbering that code comments cite by hand.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # 900 KB of Markdown, and until now nothing verified a word of it.
      # Documentation that size does not rot loudly — it rots one renamed script
      # at a time, and the first person to notice is a new engineer who runs a
      # command that does not exist and quietly stops trusting the rest.
      #
      # This checks only what can be checked mechanically: that every `pnpm
      # <script>` a document names exists, and that every path it names resolves.
      # It does not attempt to verify prose.
      - name: Documentation references
        run: pnpm docs:check

      - name: Typecheck
        run: pnpm typecheck

      # Unit and integration, both projects, with the 90% coverage gate the
      # vitest configs enforce. The suite creates and migrates its own
      # `dealersdrive_test` database — that is `global-setup`'s job, not this
      # workflow's.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # The production runtime is code now (deploy/terraform), which means it can be
  # wrong in a pull request rather than only in an account. `validate` catches a
  # bad reference or a missing argument without touching AWS — no credentials,
  # no state, no plan. A real `plan` needs the backend and is deliberately left
  # to a human running it against the environment they are changing.
  # ---------------------------------------------------------------------------
  terraform:
    name: terraform fmt / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format
        run: terraform fmt -check -recursive

      # `-backend=false` is what makes this runnable with no credentials: it
      # initialises the providers so the schema is known, without touching S3.
      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Blocking at `critical` and reporting at `high` is a deliberate split,
      # not laziness. Every current high advisory is transitive through `next`
      # or `prisma` and has no fix this repository can apply — a gate that is
      # red for reasons nobody can act on gets ignored, and then the critical
      # one is ignored too. Dependabot (.github/dependabot.yml) is what
      # actually closes these, by raising the upstream bump as a PR.
      - name: Block on critical advisories
        run: pnpm audit --audit-level=critical

      - name: Report high advisories
        continue-on-error: true
        run: pnpm audit --audit-level=high
