name: Android native validation

on:
  pull_request:
    branches: [main, feature/legal-compliance-and-consent-v1, 'feat/f*-mobile-*']
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Android release-variant compile (validation key)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_API_BASE_URL: https://api.validation.invalid
      EXPO_PUBLIC_WEB_BASE_URL: https://web.validation.invalid
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Locked dependencies and shared contracts
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dealers-drive/contracts build
      - name: Hash-pinned build-only XML parser
        run: |
          python3 -m pip install --no-cache-dir --no-deps --require-hashes --target "$RUNNER_TEMP/android-validation-python" -r apps/mobile/scripts/requirements.txt
          printf 'PYTHONPATH=%s\n' "$RUNNER_TEMP/android-validation-python" >> "$GITHUB_ENV"
      - name: Approved branding and native configuration
        run: |
          python3 apps/mobile/scripts/test_android_validation.py
          pnpm --filter @dealers-drive/mobile brand:check
          pnpm --filter @dealers-drive/mobile exec expo prebuild --platform android --no-install
      - name: Compile APK and AAB with generated validation key only
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2 --console=plain
      - name: Inspect merged release manifest and 16 KB ZIP alignment
        run: |
          python3 apps/mobile/scripts/check-android.py
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Install checksum-pinned emulator test tooling
        env:
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip
          printf '%s  %s\n' '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a' "$RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          maestroBin="$(find "$RUNNER_TEMP/maestro" -path '*/bin/maestro' -type f -print -quit)"
          test -n "$maestroBin"
          printf '%s\n' "$(dirname "$maestroBin")" >> "$GITHUB_PATH"
      - name: Enable ephemeral runner emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 guest smoke and native screenshots
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash apps/mobile/scripts/android-smoke.sh
      - name: Native UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-ui-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: artifacts/**
      - name: Validation artifacts (not for Play submission)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-validation-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/outputs/logs/manifest-merger-release-report.txt
            apps/mobile/android/app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml
