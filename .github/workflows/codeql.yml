# ---------------------------------------------------------------------------
# CodeQL — static analysis for the TypeScript in this repository.
#
# It runs on pull requests (so a finding blocks the merge rather than being
# discovered later) and weekly on main, because a rule added upstream can find
# something in code nobody has touched for months.
#
# This is the only SAST tool here on purpose. `pnpm audit` covers dependency
# advisories, ESLint covers the module-boundary rules that matter to this
# codebase specifically, and a third scanner would mostly produce a second copy
# of the same findings for a team of this size to triage twice.
# ---------------------------------------------------------------------------
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-and-quality` is noisier than the default and worth it
          # here: it catches the unused-await and missing-error-handling
          # classes that a marketplace's payment and credit paths care about.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
