# Dealers-Drive development infrastructure. `pnpm infra:up` selects local or
# development and starts PostgreSQL, Mailpit, the migrator, and the pg-boss
# worker. MinIO belongs to the local profile only. API and web run with
# `pnpm dev` on the host. The app profile remains for the optional all-Docker
# workflow.
name: dealers-drive

# The API's environment, shared by the api, migrate and seed services so the
# three can never disagree about which database they are pointed at.
x-api-env: &api-env
  NODE_ENV: development
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql://dealersdrive:dealersdrive@postgres:5432/dealersdrive
  WEB_ORIGIN: http://localhost:3000
  WEB_BASE_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  MEDIA_BASE_URL: http://localhost:4000/media
  S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  WORKER_INLINE: 'false'
  AWS_REGION: ${AWS_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-dealers-drive-local}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_PROFILE: ${AWS_PROFILE:-default}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
  MSG91_WIDGET_ID: ${MSG91_WIDGET_ID:-}
  MSG91_WIDGET_TOKEN: ${MSG91_WIDGET_TOKEN:-}

services:
  # ── backing services ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealersdrive
      POSTGRES_PASSWORD: dealersdrive
      POSTGRES_DB: dealersdrive
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealersdrive -d dealersdrive']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    profiles: [local]
    image: minio/minio:latest
    container_name: dd-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dealersdrive
      MINIO_ROOT_PASSWORD: dealersdrive
      # The browser PUTs photos straight to MinIO when STORAGE_DRIVER=minio, so
      # the bucket has to answer a preflight from the site's own origin.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: dd-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── migrations and the optional app profile ───────────────────────────────

  # Schema owner. Runs `prisma migrate deploy`, exits 0, and the API waits for
  # that exit before it starts. Applying migrations from the API's own boot
  # path would mean N replicas racing to alter the same tables.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    image: dealers-drive-migrator:local
    container_name: dd-migrate
    profiles: [app, local, development]
    restart: 'no'
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot, and never automatic: the seed TRUNCATES before it writes. Run it
  # by hand on a fresh database — `docker compose run --rm seed`.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    image: dealers-drive-migrator:local
    container_name: dd-seed
    profiles: [seed]
    restart: 'no'
    command: ['pnpm', 'db:seed']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: dealers-drive-api:local
    container_name: dd-api
    profiles: [app]
    restart: unless-stopped
    environment:
      <<: *api-env
      S3_ENDPOINT: http://minio:9000
    ports:
      - '4000:4000'
    volumes:
      - api-storage:/app/.storage
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The same pg-boss worker process used by the application. It waits for
  # PostgreSQL health and completed migrations before starting.
  worker: &worker
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: dealers-drive-api:local
    container_name: dd-worker
    profiles: [local, worker]
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-env
      WORKER_INLINE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-development:
    <<: *worker
    container_name: dd-worker-development
    profiles: [development]
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    volumes:
      - ${HOME}/.aws:/home/node/.aws:ro

  # Builds offline: every data-reading route is `force-dynamic`, so `next build`
  # calls nothing. The image is identical to the one CI builds and promotes.
  #
  # `depends_on` is about *runtime*, not the build: a web container that starts
  # before the API is answering serves 500s on its first requests.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    image: dealers-drive-web:local
    container_name: dd-web
    profiles: [app]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: local
      PORT: 3000
      # Server-to-server, over the Docker network: the browser never uses this
      # value. Next is a BFF here — the browser talks to :3000 and Next talks
      # to the API, so `api` resolving only inside the network is correct.
      API_BASE_URL: http://api:4000
      WEB_BASE_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
  api-storage:
