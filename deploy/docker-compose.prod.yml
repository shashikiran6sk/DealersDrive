# ---------------------------------------------------------------------------
# Dealers-Drive — data services for a single-box deployment.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
#
# Differences from the development docker-compose.yml at the repo root:
#   * PostgreSQL is published on 127.0.0.1 only
#   * credentials come from .env instead of being hardcoded to `dealersdrive`
#   * no MinIO or Mailpit — production storage is AWS S3 and email is Resend
# ---------------------------------------------------------------------------
name: dealers-drive

services:
  postgres:
    image: postgres:16-alpine
    container_name: dd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealersdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dealersdrive
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealersdrive -d dealersdrive']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  postgres-data:
