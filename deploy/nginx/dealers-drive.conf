# ---------------------------------------------------------------------------
# Dealers-Drive — nginx site.
#
#   sudo cp deploy/nginx/dealers-drive.conf /etc/nginx/sites-available/dealers-drive
#   sudo sed -i 's/__DOMAIN__/your-domain.com/g' /etc/nginx/sites-available/dealers-drive
#   sudo ln -sf /etc/nginx/sites-available/dealers-drive /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is plain HTTP on purpose. Run certbot afterwards:
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com -d s3.your-domain.com
# and it rewrites these blocks in place — adding :443, the certificate paths
# and the http->https redirect. Do not hand-write TLS here; let certbot own it
# so renewal keeps working.
#
# One hostname serves the whole app. The three prefixes below belong to the
# API; everything else is Next.js. That is what lets the session cookie be
# host-only: web and api are the same origin to the browser.
# ---------------------------------------------------------------------------

# Node is on loopback; these names exist so the proxy targets read clearly.
upstream dd_web { server 127.0.0.1:3000; keepalive 16; }
upstream dd_api { server 127.0.0.1:4000; keepalive 16; }
upstream dd_s3  { server 127.0.0.1:9000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # 1 MB is what the API's body parser accepts anyway; photos do not come
    # through here, they go to the s3 host below.
    client_max_body_size 2m;

    # Real client IP and scheme, for `trust proxy 1` in apps/api/src/server.ts.
    # Without these the per-IP rate limits would see one address for everyone
    # and secure cookies would be issued against the wrong scheme.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # --- API ---------------------------------------------------------------
    # /v1     — the entire versioned API, including the OAuth start/callback
    #           the browser navigates to
    # /media  — image bytes, served by the API from the bucket
    # /health — liveness and readiness probes
    location /v1/     { proxy_pass http://dd_api; }
    location /media/  { proxy_pass http://dd_api; }
    location /health/ { proxy_pass http://dd_api; }

    # Swagger, when DOCS_ENABLED=true. Longest-prefix wins, so this beats the
    # `/` block below without stealing the web app's own /api/* BFF routes.
    location /api/docs { proxy_pass http://dd_api; }

    # --- web ---------------------------------------------------------------
    location / {
        proxy_pass http://dd_web;
        # Next.js streams RSC payloads; buffering them adds latency for nothing.
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# The object store, on its own hostname.
#
# The browser uploads a photo directly to the bucket with a presigned PUT, so
# MinIO needs a public name — and it must be the name in S3_ENDPOINT, because
# the SigV4 signature covers the Host header. nginx forwards $host unchanged,
# which is exactly what makes that work.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name s3.__DOMAIN__;

    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://dd_s3;
        # Stream the upload through rather than spooling 10 MB to disk first.
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
