<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dealers-Drive promo stage</title>
    <style>
      @font-face {
        font-family: 'Manrope';
        src: url('../fonts/manrope-latin.woff2') format('woff2');
        font-weight: 200 800;
        font-display: block;
      }
      :root {
        --ink: #0d0e10;
        --paper: #ffffff;
        --accent: #0f6e5c;
        --muted: #6b7076;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        font-family: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: relative;
        overflow: hidden;
        background: #0d0e10;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 20% 10%, #23272d 0%, #0d0e10 60%),
          #0d0e10;
      }
      .backdrop.light {
        background:
          radial-gradient(120% 90% at 20% 10%, #ffffff 0%, #eef0f2 60%),
          #eef0f2;
      }
      .camera {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .screen {
        position: absolute;
        left: 0;
        top: 0;
        overflow: hidden;
        background: #fff;
      }
      .screen.card {
        border-radius: 22px;
        box-shadow:
          0 40px 120px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .screen .shot {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
      }
      .screen img.pinned {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 26px;
        height: 34px;
        transform-origin: 3px 2px;
        pointer-events: none;
        overflow: visible;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.35));
      }
      .ripple {
        position: absolute;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        border: 3px solid rgba(15, 110, 92, 0.9);
        background: rgba(15, 110, 92, 0.12);
        opacity: 0;
      }
      .lower {
        position: absolute;
        background: rgba(12, 13, 15, 0.82);
        color: #fff;
        opacity: 0;
        border-radius: 0.5em;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      }
      .lower .kicker {
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7fe0c8;
        margin-bottom: 0.4em;
      }
      .lower .line {
        font-weight: 600;
        line-height: 1.32;
        text-wrap: balance;
      }
      .title-card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
        padding: 0 8%;
      }
      .title-card.left {
        align-items: flex-start;
        text-align: left;
      }
      .title-card .eyebrow {
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #7fe0c8;
      }
      .title-card h1 {
        margin: 0.35em 0 0;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.04;
        text-wrap: balance;
      }
      .title-card p {
        margin: 0.8em 0 0;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.78);
        text-wrap: balance;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5em;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .brand .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.7em;
        height: 1.7em;
        border-radius: 0.36em;
        background: #fff;
        color: #0d0e10;
        font-size: 0.8em;
        font-weight: 800;
      }
      .brand.dark .mark {
        background: #0d0e10;
        color: #fff;
      }
      .word {
        display: inline-block;
      }
      .photo {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
      }
      .shade {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="stage.js"></script>
  </body>
</html>
