appId: ${APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: home-title
- takeScreenshot: artifacts/home-approved-brand
- tapOn: Cars
- assertVisible:
    id: cars-title
- tapOn: Sort
- assertVisible: Sort cars
- assertVisible: Newest first
- assertVisible: Price — Low to High
- takeScreenshot: artifacts/sort-native
- back
- assertVisible:
    id: cars-title
- tapOn: Filters
- assertVisible: Filters
- takeScreenshot: artifacts/filters-native
- back
- assertVisible:
    id: cars-title
- tapOn: Dealers
- assertVisible: Dealer directory
- takeScreenshot: artifacts/dealers-tab
- tapOn: Profile
- assertVisible: Your account
- assertVisible: Sign in or create account
- tapOn: Saved
- assertVisible: Sign in to see your saved cars.
- tapOn: Profile
- scrollUntilVisible:
    element:
      text: About Dealers-Drive
    direction: DOWN
- tapOn: About Dealers-Drive
- assertVisible: About Dealers-Drive
- takeScreenshot: artifacts/about-approved-brand
- back
- scrollUntilVisible:
    element:
      text: Your account
    direction: UP
- assertVisible: Your account
- stopApp
- launchApp
- assertVisible:
    id: home-title
